name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -f --connect-timeout 20 --max-time 45 "https://apna-college-bihar-6-i1fb.onrender.com/_health" || echo "Ping attempted"
