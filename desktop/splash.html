<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apna College Bihar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #172554 0%, #0a0f1d 75%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 20px;
      -webkit-app-region: drag;
    }
    .logo-container {
      position: relative;
      margin-bottom: 20px;
    }
    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 110px;
      background: #2563eb;
      filter: blur(28px);
      opacity: 0.55;
      border-radius: 50%;
      animation: pulse 2.5s infinite ease-in-out;
    }
    .logo {
      position: relative;
      width: 86px;
      height: 86px;
      border-radius: 22px;
      object-fit: contain;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }
    .subtitle {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #60a5fa;
      text-transform: uppercase;
      margin-bottom: 26px;
      background: rgba(37, 99, 235, 0.15);
      padding: 4px 12px;
      border-radius: 100px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .progress-track {
      width: 260px;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }
    .progress-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 10px;
      position: absolute;
      animation: loading 1.8s infinite ease-in-out;
    }
    .status-text {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: translate(-50%, -50%) scale(0.95); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.15); }
    }
    @keyframes loading {
      0% { left: -40%; width: 30%; }
      50% { left: 40%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-glow"></div>
    <img class="logo" src="assets/icon.png" alt="Apna College Bihar">
  </div>
  <div class="title">Apna College Bihar</div>
  <div class="subtitle">Desktop Portal v2.0</div>
  
  <div class="progress-track">
    <div class="progress-bar"></div>
  </div>
  <div class="status-text" id="status">Loading Engineering Portal...</div>

  <script>
    const messages = [
      "Loading Engineering Portal...",
      "Connecting to Bihar Engineering Network...",
      "Syncing BEU Notes & PYQs...",
      "Preparing Student Workspace..."
    ];
    let idx = 0;
    const el = document.getElementById('status');
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      el.textContent = messages[idx];
    }, 1200);
  </script>
</body>
</html>
